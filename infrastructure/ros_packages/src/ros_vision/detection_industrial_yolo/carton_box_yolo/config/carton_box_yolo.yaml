# 纸箱检测节点参数（roslaunch 用 rosparam load 进来）
# 换相机/换模型只改这里，不动代码。

# 输入彩色图。**必须是相机原始分辨率**（节点自己 letterbox 到 imgsz）。
image: "/camera/color/image_raw"

# 输出框话题 —— 与下游 box_detection 的 ~box_in 默认值一致
box_out: "/box/yolo_box"

# ONNX 权重。默认是 <包>/models/best_cartonbb.onnx，**权重不进 git**，
# 见 models/README.md。这里留空表示用默认值。
model_path: ""

# 输入边长，**必须与导出 ONNX 时一致**（默认 640）
imgsz: 640

# 置信度阈值。训练时该模型在验证集上 conf 都 >0.9，0.25 是很松的门槛，
# 目的只是滤掉 NMS-free 头里那些 conf≈0 的空 query。
conf: 0.25

# 要挑的类别 id；-1 = 不筛（单类模型只有 0）
target_class: -1

# ---- 选箱判据：置信度 + 面积 + 中心深度，归一化后加权求和 ----------------
# ⚠️ **这些默认值是拍的，没有数据支撑。** 参数化就是为了让现场能调；
# 落地后应当拿一帧多箱子的真实数据核一遍。
#
# ⚠️ **面积是同帧相对归一的**（除以本帧最大候选的面积），所以自动适应相机
# 分辨率与箱子尺寸，不需要"面积满分对应多少像素"那种常量。代价是**单候选时
# 该项恒为 1**，退化成常数 —— 此时本来也不需要它来区分。
#
# ⚠️ 取不到中心深度时**把深度项的权重按比例让给另两项**（不罚、不丢候选）：
#     score = (w_conf*conf + w_area*area_norm) / (w_conf + w_area)
# 深度空洞往往是近物遮挡造成的，罚它会适得其反。
score_w_conf: 0.5
score_w_area: 0.2
score_w_depth: 0.3

# 深度项的归一化边界（毫米）：近于此得满分、远于此得 0，中间线性。
# 依据：头部相机到「手上的箱子」的典型工作距离约 0.5~1.5 m。
z_near_mm: 500
z_far_mm: 1500

# 中心深度采样：在框中心取 (2*r+1)² 方块，**取有效像素的中位数**。
# 中位数抗空洞与飞点（黑箱子、反光、遮挡边缘），单点取法会一帧有值一帧没值。
depth_patch_px: 15

# 深度图话题。**留空 = 不订阅深度**，全部候选走"无深度"降级
# （等价于只按 conf + 面积挑）。
# ⚠️ 要求深度**已配准到彩色**（config/camera_config.yaml 的
# head_depth_registration: true）。
image_depth: "/camera/depth/image_raw"

# 深度单位换算到毫米的系数。Orbbec 头部相机发 16UC1 且**已经是毫米**（1.0）；
# 有些驱动发 32FC1 的**米**（节点会自动 ×1000，这个系数是额外兜底）。
depth_scale_mm: 1.0

# 没检到框时要不要发空消息。false = 一个字都不发，下游继续用上一帧的好值
publish_empty: false

# >0 时降频。相机 30Hz，YOLO 10Hz 就够，降频省 CPU
max_rate_hz: 0.0

# 订阅队列，1 = 只要最新帧，别堆积
queue_size: 1
