# 纸箱 OBB 检测节点参数（roslaunch 用 rosparam load 进来；命令行 arg 可覆盖）
# 换相机/换模型只改这里，不动代码。

# 输入彩色图。**必须是相机原始分辨率**（节点自己 letterbox 到 imgsz）。
image_color: "/camera/color/image_raw"

# 深度图。**只用于选箱打分**，不参与四角的计算 —— 所以取不到深度只影响
# 「挑哪一个」，不影响挑中的那个框正不正。
# ⚠️ 要求深度**已配准到彩色**（config/camera_config.yaml 的
#    head_depth_registration: true）。没配准的话采样到的不是这个箱子的深度。
image_depth: "/camera/depth/image_raw"

camera_info: "/camera/color/camera_info"

# 四角输出 —— 伺服那条链（NodeBoxObs -> NodePalletServo）吃这个
detection_out: "/box/detection"


# ONNX 权重。留空 = 用算法包给的默认路径
# `skills/atomic/perception/carton_detect/models/carton_obb.onnx`
# （**权重不进 git**，见该目录的 models/README.md）。
model_path: ""

# 输入边长，**必须与导出 ONNX 时一致**
imgsz: 640

# 置信度阈值。**只用于过滤与 NMS，不参与选箱打分**（见下）。
# 这个 OBB 模型在 val 上 conf 最低 0.96，0.25 只是滤掉低分锚点。
conf: 0.25

# 旋转框 NMS 的 IoU 阈值：两个框**互相错着盖**（同一目标的两条预测）。
# ⚠️ **导出图里没有 NMS、也没有 query 上限**（8400 个锚点行全在），同一目标会出
# 好几行 IoU>0.9 的重复框。不去重的话下游会把它们当成好几个箱子。
# 实测 val 330 帧：NMS 前中位 4 个候选，NMS 后中位 1 个。
nms_iou: 0.45

# 旋转框 NMS 的**第二条**判据：`交 / 较小面积`。
# 专门管 IoU 够不着的那一类 —— **小框整个套在大框里**（只框了箱子一角）。
# 那时 IoU ≈ 小面积/大面积，实测碎框 IoU 0.25、IoMin 1.0，阈值给多低都放它过去。
# 抑制仍按置信度降序，所以留下的是**置信度最高的那个**。
#
# 0.85 的依据（carton_data 22 张手标，5574 个候选对）：
#   同一条真值箱的两条重复预测  IoMin 最大 1.000（3134 条）
#   两条不同真值箱（**真箱子**）IoMin 最大 **0.460**（1565 条）
# 0.50 即可做到误伤 0（多杀 2 对）；取 0.85 留 0.39 的余量。
# ⚠️ 别往 0.50 以下压：两条只是**擦边**的真箱子 IoMin 能到 0.46。
# >= 1.0 = 关掉这条（等价于只有 IoU 的旧行为）。
nms_iomin: 0.85

# ---- 时间窗（照抄旧链路的口径，好让下游与参数都不用改） -------------------
# 相机 30Hz。`process_every` 直接决定 `/box/detection` 的上限，而
# `/pallet/dis` 是**配对后**输出的，被 min(托盘率, 纸箱率) 封顶 ——
# 2026-10-19 实测：process_every=3 时纸箱只有 7.8Hz，把 `/pallet/dis`
# 从 12.3Hz 拖到 7~8Hz。单帧推理+解码+选箱 27~40ms，30Hz 输入撑得住，故取 1。
# 窗口 = 最近 3 个处理槽，四角逐点平均（只压抖动，不降频）。
window: 3
process_every: 1
agg: "mean"

# >0 时降频。相机 30Hz、本节点 10Hz 就够
max_rate_hz: 0.0

# 队列，1 = 只要最新帧，别堆积
queue_size: 1

# ---- 选箱判据（2026-10-13 改） --------------------------------------------
# 相机固定俯视，**手里的箱子永远在画面下方中心**，所以主判据是
# 「框质心到画面下方中心的距离」，越近分越高。三项归一化后加权求和：
#
#     score = w_dcenter * d_center_score(d_px)   # 绝对刻度，越近越高
#           + w_area    * (area_px / 同帧最大面积)
#           + w_depth   * depth_score(z_mm)      # 越近越高
#
# ⚠️ **置信度不参与打分**（它以前占 0.5）。现场实测反例：val 的 36 个多框帧里
#    有一帧手箱 conf 0.9773、邻箱 0.9642（分不开），而**邻箱面积还更大**
#    （46147 > 45118）——「conf 最高」和「面积最大」都会挑错。conf 仍用于过滤
#    与 NMS 排序。距离的分离度实测：手标双箱 10 帧中位 192.9px、模型预测
#    双箱帧中位 127.7px。
#
# ⚠️ **`d_near_px` / `d_far_px` 是 640x480 口径的绝对刻度**，换分辨率要跟着改。
#    依据：手里那个箱子的框质心 d 中位 140px（new_yolo 手标 10 帧）、val 330 帧
#    的 d 中位 150px；邻箱 244~463px。100/450 让手箱拿 0.89~0.94、邻箱拿 0.03~0.59。
score_w_dcenter: 0.5
score_w_area: 0.2
score_w_depth: 0.3
d_near_px: 100.0
d_far_px: 450.0

# 深度项的刻度（毫米）：近于此得满分、远于此得 0，中间线性。
# 依据：头部相机到「手上的箱子」的典型工作距离约 0.5~1.5 m。
z_near_mm: 500
z_far_mm: 1500

# 中心深度采样：在框中心取 (2*r+1)² 方块，**取有效像素的中位数**。
# 中位数抗空洞与飞点（黑箱子、反光、遮挡边缘），单点取法会一帧有值一帧没值。
depth_patch_px: 15

# 深度单位换算到毫米的系数。Orbbec 头部相机发 16UC1 且**已经是毫米**（1.0）；
# 有些驱动发 32FC1 的**米**（节点会自动 ×1000，这个系数是额外兜底）。
depth_scale_mm: 1.0

# 没检到箱子时要不要发一帧 valid=false。false = 一个字都不发，下游继续用上一帧
publish_empty: false

# 两路（彩色 + 深度）时间戳允许的最大差
sync_slop_s: 0.05

# 处理慢于这个就告警一次（节流）
queue_warn_ms: 200.0

# 心跳周期（秒）。**成功、没检到、没数据都打** —— 本节点原来的日志点全是一次性的
# 或只在异常/节流时打，于是「一切正常」与「工作线程死了 / 相机停了」在日志上
# 长得一模一样（都是什么都不打）。托盘那条链 2026-09-29 就是这么被卡过一次。
# 读法：`pub` 在涨 = 在发布；`proc` 涨而 `pub` 不涨 = 在拒（下一行给原因）；
# `proc` 都不涨 = 线程死了或相机停了。`0` = 关掉。
heartbeat_s: 5.0

# ---- 推理后端（2026-10-20）-----------------------------------------------
# auto   ：启动时探测公共 TensorRT 服务 `/carton_obb/infer`。在就用它的输出，
#          不在就自己加载上面的 ONNX。探测只做一次。
# shared ：强制用公共服务；探测不到打 ERROR 并退回本地。
# local  ：强制本地 ONNX，连探测都不做。
# ⚠️ 两条路的解码 / NMS / 选箱 / 时间窗是**同一段代码**：服务端只做前处理 +
#    推理（这里请求它不做 NMS），去重与选箱都在本地，所以两种来源的输出口径
#    一致（`dets_from_rotated_rects` 与 `decode_obb` 有逐字段等价性测试）。
# ⚠️ 用公共服务时，发布的 header 用**响应里的 source_header**（服务端缓存的最新
#    帧），深度按该 stamp 精确配对，配不上才退回最新一帧。
infer_mode: "auto"
infer_service: "/carton_obb/infer"
infer_probe_s: 2.0
shared_fail_limit: 3
